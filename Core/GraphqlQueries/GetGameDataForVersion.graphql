query GetGameDataForVersion(
    $versionGroupName: String!,
    $versionName: String!,
    $generationName: String!) {
    encountersData: pokemon_v2_locationarea(
        where: {
            pokemon_v2_location: {
                pokemon_v2_region:  {
                    pokemon_v2_versiongroupregions:  {
                        pokemon_v2_versiongroup:  {
                            name: {_eq: $versionGroupName}
                        }
                    }
                }
            }
        }
    ) {
        id
        name
        pokemon_v2_encounters(
            where: {
                pokemon_v2_version: {
                    name: {
                        _eq: $versionName
                    }
                }
            }
        ){
            id
            max_level
            min_level
            pokemon_v2_version{
                id
                name
            }
            pokemon_v2_pokemon{
                id
                name
            }
            pokemon_v2_encounterslot{
                id
                rarity
                slot
                pokemon_v2_encountermethod{
                    id
                    name
                    order
                }
            }
        }
        pokemon_v2_location{
            id
            name
        }
    }

    # Get pokedex and region details
    regionData: pokemon_v2_versiongroupregion(
        where: {
            pokemon_v2_versiongroup:  {
                name: {
                    _eq: $versionGroupName
                }
            }
        }){
        id
        pokemon_v2_region{
            id
            name
            pokemon_v2_pokedexes(
                where: {
                    pokemon_v2_pokedexversiongroups:  {
                        pokemon_v2_versiongroup:  {
                            name:  {
                                _eq: $versionGroupName
                            }
                        }
                    }
                }
            ){
                id
                name
                pokemon_v2_pokemondexnumbers{
                    id
                    pokemon_v2_pokemonspecy{
                        id
                        name
                        pokemon_v2_pokemons(
                            where:  {
                                is_default:  {
                                    _eq: true
                                }
                            }
                        ){
                            id
                            name
                            order
                            pokemon_v2_pokemonabilities(
                                where:  {
                                    is_hidden:  {
                                        _eq: false
                                }
                            }){
                                id
                                slot
                                pokemon_v2_ability{
                                    id
                                    name
                                }
                            }
                            pokemon_v2_pokemonabilitypasts(
                                where:  {
                                    is_hidden:  {
                                        _eq: false
                                }
                            }){
                                id
                                slot
                                pokemon_v2_ability{
                                    id
                                    name
                                }
                            }
                            pokemon_v2_pokemonstats{
                                id
                                base_stat
                                pokemon_v2_stat{
                                    id
                                    name
                                }
                            }
                            #pokemon_v2_pokemonstatpasts(
                            #    where: {
                            #        pokemon_v2_generation: {
                            #            name: {
                            #                _eq: $generationName
                            #            }
                            #        }
                            #    }
                            #){
                            #    id
                            #    base_stat
                            #    effort
                            #    stat{
                            #        id
                            #        name
                            #    }
                            #}
                            pokemon_v2_pokemontypes{
                                id
                                slot
                                pokemon_v2_type{
                                    id
                                    name
                                }
                            }
                            pokemon_v2_pokemontypepasts(
                                where: {
                                    pokemon_v2_generation: {
                                        name: {
                                            _eq: $generationName
                                        }
                                    }
                                }
                            ){
                                id
                                slot
                                pokemon_v2_type{
                                    id
                                    name
                                }
                            }
                        }
                    }
                }
            }
        }
    }
}