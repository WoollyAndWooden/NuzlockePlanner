query GetInitialData {
    generations: pokemon_v2_generation {
        id
        name
        pokemon_v2_versiongroups {
            id
            name
            order
            pokemon_v2_versions {
                id
                name
            }
            pokemon_v2_pokedexversiongroups(
                where: {
                    pokemon_v2_pokedex: {
                        is_main_series: {_eq: true}
                    }
                }
            ){
                pokemon_v2_pokedex {
                    id
                    name
                    pokemon_v2_pokemondexnumbers_aggregate{
                        aggregate {
                            count
                        }
                    }
                }
            }
        }
    }
}