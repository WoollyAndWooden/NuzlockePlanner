name: Deploy to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore NuGet packages
        run: dotnet restore --no-cache --force

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Run Core Tests
        run: cd Core.Test && dotnet test

      - name: Run Web Tests
        run: cd Web.Test && dotnet test

      - name: Build and Publish
        run: |
          dotnet build Web/Web.csproj -c Release --no-restore
          cp -r sprites wwwroot/
          dotnet publish Web/Web.csproj -c Release --no-restore -o release /p:GHPages=true --nologo
          cd release/wwwroot
          mkdir -p _framework
          cp -r ../../Web/bin/Release/net10.0/wwwroot/* .

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'release/wwwroot'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
